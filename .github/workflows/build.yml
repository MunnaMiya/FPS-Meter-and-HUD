name: Build Signed Play Store AAB and APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Web Assets (if package.json exists)
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build || true
            if [ -d "dist" ]; then
              mkdir -p app/src/main/assets
              cp -r dist/* app/src/main/assets/ || true
            fi
          fi

      - name: Accept Android SDK Licenses & Install API 37
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "build-tools;36.0.0" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Decode Signing Keystore (With Fallback Paths)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing in Settings -> Secrets -> Actions!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > app/release.keystore
          cp app/release.keystore ./release.keystore
          cp app/release.keystore ./my-upload-key.jks
          cp app/release.keystore app/my-upload-key.jks

      - name: Build Signed Release APK & AAB (API 29 to 37)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
        run: gradle assembleRelease bundleRelease -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" --stacktrace

      - name: Upload Signed APK (For Testing on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: installable-phone-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Signed AAB (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: play-store-release-aab
          path: app/build/outputs/bundle/release/*.aab
